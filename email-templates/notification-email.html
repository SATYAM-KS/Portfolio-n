<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Project Inquiry — Satyam Singh</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 16px;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background-color: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }
    .header {
      background-color: #1e1e1e;
      padding: 24px;
      border-bottom: 1px solid #2a2a2a;
    }
    .badge {
      font-size: 11px;
      font-family: monospace;
      color: #00d2ff;
      letter-spacing: 1px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 6px;
    }
    .content {
      padding: 24px;
    }
    .field {
      margin-bottom: 18px;
    }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888888;
      margin-bottom: 4px;
    }
    .val {
      font-size: 15px;
      color: #ffffff;
      font-weight: 500;
    }
    .message-box {
      background-color: #1c1c1c;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #dddddd;
      white-space: pre-wrap;
    }
    .cta {
      display: inline-block;
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="badge">[ NEW INQUIRY // PORTFOLIO CONTACT FORM ]</div>
      <div class="title">{{from_name}} wants to collaborate</div>
    </div>
    <div class="content">
      <div class="field">
        <div class="label">Sender Name</div>
        <div class="val">{{from_name}}</div>
      </div>
      <div class="field">
        <div class="label">Sender Email</div>
        <div class="val"><a href="mailto:{{from_email}}" style="color:#00d2ff;text-decoration:none">{{from_email}}</a></div>
      </div>
      <div class="field">
        <div class="label">Project Description</div>
        <div class="message-box">{{message}}</div>
      </div>
      <a href="mailto:{{from_email}}?subject=Re:%20Project%20Inquiry%20-%20Satyam%20Singh" class="cta">Reply Directly to {{from_name}} ↗</a>
    </div>
  </div>
</body>
</html>
